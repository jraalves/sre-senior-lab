# Prometheus do lab-05. Raspa o exportador do collector (que recebe OTLP da
# aplicacao) e o endpoint interno do proprio collector. Sem segredo, sem
# service discovery externa: ambiente local de treino.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    lab: lab-05-golden-signals
    dados: sinteticos

scrape_configs:
  - job_name: otel-collector-exporter
    static_configs:
      - targets: ["otel-collector:8889"]
  - job_name: otel-collector-internal
    static_configs:
      - targets: ["otel-collector:8888"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
